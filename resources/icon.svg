<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f5f3ff" />
      <stop offset="75%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Centered Soft Halo Radial Gradients -->
    <radialGradient id="haloGlowWide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloGlowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Clean Unclipped Flame Luminous DropShadow Glow Filter -->
    <filter id="flameGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#818cf8" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>

    <!-- Green LED Glow Filter -->
    <filter id="ledGreenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyan/Blue LED Glow Filter -->
    <filter id="ledBlueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Server Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- High-tech Grid Pattern (Fondo cuadriculado) -->
    <pattern id="serverGrid" width="24" height="24" patternUnits="userSpaceOnUse" x="4" y="4">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Clip Path for the Squircle -->
    <clipPath id="squircleClip">
      <rect x="12" y="12" width="232" height="232" rx="54" />
    </clipPath>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 2. High-Tech Grid Background (Fondo cuadriculado recortado en el squircle) -->
  <rect x="12" y="12" width="232" height="232" clip-path="url(#squircleClip)" fill="url(#serverGrid)" />

  <!-- 3. Perfectly Centered Luminous Soft Halo (Centered at X=128, Y=96) -->
  <circle cx="128" cy="96" r="82" fill="url(#haloGlowWide)" />
  <circle cx="128" cy="96" r="48" fill="url(#haloGlowCore)" />

  <!-- 4. Ignite Flame (Centered at X=128, Y=96 with soft glowing filter) -->
  <!-- Local bounds: X in [5, 19] (center 12), Y in [3, 22] (center 12.5) -->
  <g transform="translate(128, 96) scale(6.2) translate(-12, -12.5)" filter="url(#flameGlow)">
    <path d="M8.5 14.5 A2.5 2.5 0 0 0 11 12 c0-1.38-.5-2-1-3 -1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5 a7 7 0 1 1-14 0 c0-1.153.433-2.294 1-3 a2.5 2.5 0 0 0 2.5 2.5z" 
          fill="url(#flameGrad)" 
          stroke="#ffffff" 
          stroke-width="0.35" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- 5. Server Chassis Blade (Bottom Unit, Centered at X=128, Y=180 to 216) -->
  <rect x="44" y="180" width="168" height="36" rx="8" fill="url(#chassisGrad)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <!-- Server Panel Accents -->
  <!-- Left Side: Power & Activity LEDs -->
  <circle cx="64" cy="198" r="4.5" fill="#10b981" filter="url(#ledGreenGlow)" />
  <circle cx="64" cy="198" r="2" fill="#ffffff" />

  <circle cx="80" cy="198" r="4.5" fill="#38bdf8" filter="url(#ledBlueGlow)" />
  <circle cx="80" cy="198" r="2" fill="#ffffff" />

  <!-- Center-Right: Server Ventilation Grille Lines -->
  <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.2" stroke-linecap="round">
    <line x1="104" y1="193" x2="192" y2="193" />
    <line x1="104" y1="203" x2="192" y2="203" />
  </g>
</svg>

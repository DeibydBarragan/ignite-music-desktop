<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5f3ff" />
      <stop offset="80%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Centered Soft Halo Radial Gradient -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="80%" stop-color="#4f46e5" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Green LED Glow Filter -->
    <filter id="ledGreenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyan/Blue LED Glow Filter -->
    <filter id="ledBlueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Server Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 2. Perfectly Centered Soft Halo (Centered at X=128, Y=96) -->
  <circle cx="128" cy="96" r="68" fill="url(#haloGlow)" />

  <!-- 3. Ignite Flame (Perfect Center at X=128, Y=96) -->
  <!-- Original path local bounds: X in [5, 19] (center 12), Y in [3, 22] (center 12.5) -->
  <g transform="translate(128, 96) scale(6.2) translate(-12, -12.5)">
    <path d="M8.5 14.5 A2.5 2.5 0 0 0 11 12 c0-1.38-.5-2-1-3 -1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5 a7 7 0 1 1-14 0 c0-1.153.433-2.294 1-3 a2.5 2.5 0 0 0 2.5 2.5z" 
          fill="url(#flameGrad)" 
          stroke="#ffffff" 
          stroke-width="0.35" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- 4. Server Chassis Blade (Bottom Unit, Centered at X=128, Y=180 to 216) -->
  <rect x="44" y="180" width="168" height="36" rx="8" fill="url(#chassisGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Server Panel Accents -->
  <!-- Left Side: Power & Activity LEDs -->
  <circle cx="64" cy="198" r="4" fill="#10b981" filter="url(#ledGreenGlow)" />
  <circle cx="64" cy="198" r="1.8" fill="#ffffff" />

  <circle cx="80" cy="198" r="4" fill="#38bdf8" filter="url(#ledBlueGlow)" />
  <circle cx="80" cy="198" r="1.8" fill="#ffffff" />

  <!-- Center-Right: Sleek Server Ventilation Grille Lines -->
  <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.2" stroke-linecap="round">
    <line x1="104" y1="193" x2="192" y2="193" />
    <line x1="104" y1="203" x2="192" y2="203" />
  </g>
</svg>

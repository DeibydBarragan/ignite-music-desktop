<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5f3ff" />
      <stop offset="85%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Flame Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Green LED Glow Filter -->
    <filter id="ledGreenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyan/Blue LED Glow Filter -->
    <filter id="ledBlueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 2. Subtle Internal Grid / Matrix lines (Server Ambience) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="48" y1="36" x2="208" y2="36" />
    <line x1="48" y1="72" x2="208" y2="72" />
    <line x1="48" y1="108" x2="208" y2="108" />
    <line x1="48" y1="144" x2="208" y2="144" />
    <line x1="76" y1="20" x2="76" y2="160" />
    <line x1="128" y1="20" x2="128" y2="160" />
    <line x1="180" y1="20" x2="180" y2="160" />
  </g>

  <!-- 3. Ignite Flame (Center) -->
  <g transform="translate(128, 92) scale(6.4)" filter="url(#flameGlow)">
    <!-- Original Ignite Flame Path Centered at (0, 0) -->
    <!-- Original Box: 14x14 approx, offset (-11, -11) -->
    <path d="M-2.5 3.5 A2.5 2.5 0 0 0 0 1 c0-1.38-.5-2-1-3 -1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5 a7 7 0 1 1-14 0 c0-1.153.433-2.294 1-3 a2.5 2.5 0 0 0 2.5 2.5z" 
          fill="url(#flameGrad)" 
          stroke="#ffffff" 
          stroke-width="0.35" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- 4. Subtle Circuit / Data Bus Connector -->
  <line x1="128" y1="140" x2="128" y2="166" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6" />
  <circle cx="128" cy="142" r="2.5" fill="#c7d2fe" opacity="0.8" />
  <circle cx="128" cy="166" r="2" fill="#818cf8" />

  <!-- 5. Server Chassis Blade (Bottom Unit) -->
  <rect x="44" y="172" width="168" height="38" rx="8" fill="url(#chassisGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Server Panel Accents -->
  <!-- Left Side: Power & Activity LEDs -->
  <circle cx="64" cy="191" r="4.5" fill="#10b981" filter="url(#ledGreenGlow)" />
  <circle cx="64" cy="191" r="2" fill="#ffffff" />

  <circle cx="80" cy="191" r="4" fill="#38bdf8" filter="url(#ledBlueGlow)" />
  <circle cx="80" cy="191" r="1.8" fill="#ffffff" />

  <!-- Center-Right: Server Ventilation Grille Slots -->
  <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.2" stroke-linecap="round">
    <line x1="106" y1="184" x2="194" y2="184" />
    <line x1="106" y1="191" x2="194" y2="191" />
    <line x1="106" y1="198" x2="194" y2="198" />
  </g>
</svg>
